services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: sentinelle
      POSTGRES_DB: sentinelle
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinelle:sentinelle@db:5432/sentinelle
      CORS_ORIGINS: "*"
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - images:/data/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  images:
