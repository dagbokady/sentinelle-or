# Configuration Sentinelle-Or
# Les secrets (identifiants API) sont lus depuis les variables d'environnement (.env).

acquisition:
  bbox: [-8.6, 4.3, -2.5, 10.7]       # [lon_min, lat_min, lon_max, lat_max] — Côte d'Ivoire
  max_cloud_cover: 20                  # %
  lookback_days: 10                    # fenêtre de recherche à chaque cycle
  backfill_days: 365                   # historique récupéré au premier démarrage (base vide)
  schedule_hours: 6                    # cron : toutes les 6 heures
  storage_dir: data/images             # GeoTIFF rangés par satellite/AAAA-MM-JJ/
  max_products_per_run: 5
  sources:
    # Sentinel-2 L2A en COG public (AWS / Element84) — sans compte. Lit uniquement les zones surveillées.
    earthsearch:
      enabled: true
      stac_url: https://earth-search.aws.element84.com/v1
      collection: sentinel-2-l2a
      tile_cloud_max: 30               # préfiltre catalogue (% de la tuile entière)
      min_valid_fraction: 0.6          # part minimale de pixels non nuageux SUR la zone
    sentinel2:
      enabled: true
      odata_url: https://catalogue.dataspace.copernicus.eu/odata/v1
      token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      download_url: https://zipper.dataspace.copernicus.eu/odata/v1
    landsat:
      enabled: true
      m2m_url: https://m2m.cr.usgs.gov/api/api/json/stable
      dataset: landsat_ot_c2_l2

# Zones surveillées (lecture fenêtrée des images). Bassins d'orpaillage documentés.
aois:
  - {id: HIRE, name: "Hiré", bbox: [-5.36, 6.14, -5.24, 6.26]}
  - {id: KOKUMBO, name: "Kokumbo", bbox: [-5.33, 6.45, -5.21, 6.57]}
  - {id: MARAHOUE, name: "Parc de la Marahoué", bbox: [-6.10, 6.98, -5.98, 7.10]}
  - {id: ZOUAN, name: "Zouan-Hounien", bbox: [-8.18, 6.86, -8.06, 6.98]}
  - {id: TENGRELA, name: "Tengréla", bbox: [-6.47, 10.40, -6.35, 10.52]}
  - {id: DABAKALA, name: "Dabakala", bbox: [-4.49, 8.30, -4.37, 8.42]}

processing:
  # --- Détection du changement par khi² (et non par seuil fixe) -----------------
  # Pour chaque pixel : d = NDVI_après − NDVI_avant. On compare d à la normalité de la
  # zone (baisse médiane + dispersion robuste), via khi² = ((d − médiane) / dispersion)².
  # Un pixel est retenu s'il baisse BEAUCOUP plus que ses voisins (khi² > seuil) ET si
  # sa baisse dépasse `min_abs_drop` en valeur absolue (garde-fou physique).
  chi2_threshold: 6.63                 # seuil khi² à 1 degré de liberté, p = 0.01 (99 %)
  min_abs_drop: 0.20                   # baisse minimale de NDVI exigée (valeur absolue)
  min_dispersion: 0.03                 # plancher de dispersion (zone très homogène)
  # Seuil fixe historique, conservé pour comparaison / repli (non utilisé par défaut)
  delta_ndvi_threshold: -0.30
  max_ndvi_after: 0.30                 # la zone doit être devenue sol nu / eau
  cloud_buffer_px: 10                  # zone tampon autour des nuages masqués (10 px = 100 m)
  reference_depth: 3                   # référence = dernière valeur valide par pixel sur les N images précédentes
  min_pixels: 4                        # amas contigus minimaux avant vectorisation
  tile_size: 2048                      # traitement par blocs (mémoire)

filters:
  min_surface_ha: 0.5
  max_surface_ha: 50
  # Ratio périmètre² / surface (sans unité). Un carré vaut 16, un cercle 12.57.
  min_shape_ratio: 18
  # Sol nu / latérite / sable : rouge > 0,07. Un brûlis récent est sombre dans tout le visible.
  min_red_after: 0.07

scoring:
  weights:
    delta_ndvi: 35
    irregularity: 25
    river_proximity: 20
    recidive: 20
  delta_ndvi_max: 0.7                  # |ΔNDVI| ≥ 0.7 → score partiel max
  compacity_regular: 0.75
  compacity_irregular: 0.25
  river_distance_full_m: 500
  river_distance_zero_m: 2000
  recidive_buffer_m: 500
  recidive_months: 12
  thresholds:
    urgente: 75
    moderee: 50

data:
  rivers_path: data/rivers/rivers_ci.geojson
  localities_path: data/localities.json
